name: Build UDX710 Tools

on:
  push:
  workflow_dispatch:

jobs:
  build-arm:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
          sudo apt-get update
          sudo apt-get install -y nodejs wget xz-utils

      # Device glibc is older than Ubuntu 22.04 apt cross-gcc (needs GLIBC_2.33+).
      # Use Linaro 7.5 (glibc ~2.25). releases.linaro.org is dead → HuggingFace mirror.
      - name: Cache Linaro 7.5 aarch64 toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/tools/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu
          key: gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu-v3

      - name: Configure Linaro 7.5 cross compiler
        run: |
          set -euo pipefail
          TOOLS="$GITHUB_WORKSPACE/tools"
          TC="$TOOLS/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu"
          ARCHIVE="gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz"
          mkdir -p "$TOOLS"

          if [ ! -x "$TC/bin/aarch64-linux-gnu-gcc" ]; then
            URL="https://huggingface.co/csukuangfj/sherpa-ncnn-toolchains/resolve/main/${ARCHIVE}"
            echo "Downloading $URL"
            wget -q --show-progress -O "$ARCHIVE" "$URL"
            size=$(wc -c < "$ARCHIVE")
            echo "Downloaded $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "Download too small — refusing to extract"
              exit 1
            fi
            xz -t "$ARCHIVE"
            tar xf "$ARCHIVE" -C "$TOOLS"
          fi

          echo "PATH=$PATH:$TC/bin" >> "$GITHUB_ENV"
          "$TC/bin/aarch64-linux-gnu-gcc" --version

      - name: build web
        run: |
          cd web
          npm install && npm run build

      - name: build server
        run: |
          cd src
          make
          # Sanity: binary should NOT require GLIBC_2.33+
          aarch64-linux-gnu-readelf -V build/ofono-server | tee /tmp/glibc-versions.txt || true
          if aarch64-linux-gnu-readelf -V build/ofono-server 2>/dev/null | grep -E 'GLIBC_2\.(3[3-9]|[4-9][0-9])'; then
            echo "ERROR: binary requires too-new GLIBC for device"
            exit 1
          fi
          echo "GLIBC check OK"

      - name: dopack
        run: |
          mkdir -p output/6677
          # Robust launcher (absolute path + nohup); see packaging/start.sh
          cp packaging/start.sh output/6677/start.sh
          chmod 755 output/6677/start.sh
          cp -r web/dist output/6677/
          cp src/build/ofono-server output/6677/server
          # APN apply helper (persist + cellular bounce); C path also works alone
          if [ -f packaging/scripts/apn-apply-now.sh ]; then
            cp packaging/scripts/apn-apply-now.sh output/apn-apply-now.sh
            chmod 755 output/apn-apply-now.sh
          fi
          # H9 soft-reboot recover (multi-UDC); install.sh copies to /home/root
          if [ -f packaging/scripts/usb-tether.sh ]; then
            cp packaging/scripts/usb-tether.sh output/usb-tether.sh
            chmod 755 output/usb-tether.sh
          fi
          cp packaging/install.sh output/install.sh
          chmod 755 output/install.sh
          file output/6677/server
          ls -la output/6677/server output/install.sh
          ls -la output/apn-apply-now.sh output/usb-tether.sh 2>/dev/null || true
          head -n 20 output/6677/start.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udx710-tools
          path: output
